[project]
# The import name stays `meridian`; `meridian` itself is taken on PyPI.
name = "meridian-eval"
dynamic = ["version", "readme"]
description = "A CI gate for AI agents: isolated trials, outcome grading, pass^k with honest intervals, and a verdict that says what it could not detect."
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "Pranav T Pattanashetty" }]
keywords = ["llm", "agents", "evaluation", "evals", "benchmark", "ci", "pass^k", "docker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "docker>=7.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "numpy>=2.1",
    "httpx>=0.28",
    "starlette>=0.45",
    "uvicorn>=0.34",
    "structlog>=25.1",
    "jsonpath-ng>=1.7",
    "opentelemetry-sdk>=1.29",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0.52",
]

[project.urls]
Homepage = "https://patsypppe.github.io/meridian/"
Source = "https://github.com/patsypppe/meridian"
Dashboard = "https://patsypppe.github.io/meridian/dashboard/"
Changelog = "https://github.com/patsypppe/meridian/blob/main/CHANGELOG.md"

[project.scripts]
meridian = "meridian.cli:app"

[dependency-groups]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "types-pyyaml>=6.0",
    "types-docker>=7.1",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/meridian/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/meridian"]

# Runtime files that live outside the package in the repository. Copied in at
# build time so a checkout and a wheel share one source of truth (see assets.py).
[tool.hatch.build.targets.wheel.force-include]
"envs/proxy/Dockerfile" = "meridian/_assets/proxy.Dockerfile"
"fixtures/terminal_agent" = "meridian/_assets/agents/terminal_agent"

[tool.hatch.build.targets.sdist]
include = [
    "src/meridian",
    "envs/proxy/Dockerfile",
    "fixtures/terminal_agent",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]

# PyPI renders the README outside the repository, where relative links break.
# Rewrite them to absolute GitHub URLs at build time; the README itself is unchanged.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)(docs/[^)]+\.(?:png|svg|jpg))\)'
replacement = '](https://raw.githubusercontent.com/patsypppe/meridian/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/patsypppe/meridian/blob/main/\1)'

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # typer uses function calls in argument defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.13"
files = ["src/meridian", "benchmarks"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = false

[[tool.mypy.overrides]]
module = ["docker.*", "jsonpath_ng.*", "yaml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: pure-logic tests, no Docker, no network (< 5s total)",
    "integration: requires the Docker daemon (< 3min)",
    "e2e: full run/replay/gate against the fixture agent (< 10min)",
    "slow: end-to-end gate runs measured in minutes; excluded from -m e2e by default",
]
