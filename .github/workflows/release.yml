name: release

# Publishes meridian-eval to PyPI when a GitHub release is published (or a vX.Y.Z
# tag is pushed). Uses PyPI trusted publishing: no API token is stored anywhere;
# PyPI trusts this workflow, in this repository, in the `pypi` environment.
#
# One-time setup on pypi.org (account settings -> Publishing -> add a pending
# publisher): project `meridian-eval`, owner `patsypppe`, repository `meridian`,
# workflow `release.yml`, environment `pypi`.

on:
  release:
    types: [published]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: The tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/meridian/version.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != package version $version"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'pypi' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/p/meridian-eval' || 'https://pypi.org/p/meridian-eval' }}
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1

  # After PyPI has the files, record the release on GitHub too, with the same
  # artifacts and the matching CHANGELOG section as its notes.
  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Install from PyPI: \`pip install meridian-eval==${version}\` (or \`uv tool install meridian-eval\`), then \`meridian setup\`."
            echo
            awk -v v="## ${version}" '$0==v{f=1;next} /^## /{if(f)exit} f' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "Meridian ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag
          fi
